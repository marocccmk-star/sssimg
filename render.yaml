services:
  - type: web
    name: ai-photo-backend
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-photo-db
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: AI_PROVIDER
        value: fal
      - key: FAL_API_KEY
        sync: false
      - key: FAL_MODEL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "15"

databases:
  - name: ai-photo-db
    plan: starter
